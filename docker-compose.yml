# Local development database.
# First copy .env.example to .env and set a password, then run: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yerevan
      # Compose reads this from the root .env file and stops with this message if it's missing.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: yerevan_dev
    ports:
      # 127.0.0.1 means only this computer can connect, not the whole network.
      - "127.0.0.1:5432:5432"
    volumes:
      # Keeps the data when the container is removed.
      - postgres-data:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data volume is first created.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 checks over TCP, which only opens after first-time setup has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "yerevan", "-d", "yerevan_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
